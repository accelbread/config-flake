#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-luna"
model_reasoning_effort = "medium"
service_tier = "flex"

sandbox_mode = "read-only"
approval_policy = "on-request"
approvals_reviewer = "user"
file_opener = "none"
web_search = "disabled"
cli_auth_credentials_store = "keyring"
check_for_update_on_startup = false

developer_instructions = '''
Use Nix or Git (blob:none), preferably Nix, to fetch sources for investigation.
Use Kagi for generic web search and page extraction, not for source code.

To fetch source with Nix, build a flakeref such as self#hello.src to get a
source store path. The system configuration makes the flake used to build it
available as `self`.
'''

[features]
api_key_model_discovery = true

[mcp_servers.kagi]
url = "http://127.0.0.1:25619/kagi/mcp"
enabled = true

[tui]
show_tooltips = false

[feedback]
enabled = false

[analytics]
enabled = false
